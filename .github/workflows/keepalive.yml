# Keeps the online service awake: a free Supabase project pauses itself after a week
# without API traffic, and a paused project means no sign-in and no online play until
# someone restores it from the dashboard. One tiny read a day is enough.
name: keep the online service awake
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: read one row
        run: |
          curl -sS -f -o /dev/null "https://ckcgupksgfadhtyhycdl.supabase.co/rest/v1/meta?select=key" -H "apikey: sb_publishable_yuyifKD-n51bRtmdzH_vlA_EdUgeJWX" -H "Authorization: Bearer sb_publishable_yuyifKD-n51bRtmdzH_vlA_EdUgeJWX"
